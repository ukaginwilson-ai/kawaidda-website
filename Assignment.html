<!DOCTYPE html>
<html lang="en">
<head>


    <link rel="stylesheet" href="Assignment.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <form class="login-form">
      <h2>Welcome Back</h2>
      <p class="subtitle">Please enter your details to sign in</p>

      <div class="input-group">
        <label for="Full Name">Full Name</label>
        <input type="text" id="Full Name" placeholder="Lukwago Wilson Kawagga" required>
      </div>

      <div class="input-group">
        <label for="Date of birth">Date of birth</label>
        <input type="datetime-local" id="Date of birth" placeholder="JUL/15/1991" required>
      </div>

<div class="input-group">
        <label for="Sex">Sex</label>
        <input type="radio" id="Male" name="sex" value="Male" required>
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="sex" value="Female" required>
        <label for="Female">Female</label>
  <label for="submit"</label><br><br>
  <input type="submit" value="Submit">
      </div>


      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

 <div class="input-group">
        <label for="Comment">Comment</label>
        <input type="text" id="Comment" placeholder="Enter your comment" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>

      <p class="signup-text">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </form>
  </div>

</body>
</html>
